[project]
# The name below is what `is_doc_builder_repo` looks for to detect this repo, do not rename it.
name = "hf-doc-builder"
version = "0.6.0.dev0"
description = "Doc building utility"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache"}
authors = [
    {name = "Hugging Face, Inc.", email = "docs@huggingface.co"}
]
keywords = ["doc", "documentation", "doc-builder", "huggingface", "hugging face"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "GitPython",
    "tqdm",
    "pyyaml",
    "packaging",
    "nbformat",
    "huggingface_hub",
    "pillow",
    "meilisearch==0.34.1",
    "watchdog>=6.0.0",
    "httpx",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/huggingface/doc-builder"
Repository = "https://github.com/huggingface/doc-builder"

[project.optional-dependencies]
transformers = ["transformers[dev]"]
# `doc-builder translate` runs a real model, so these cannot be mocked away like the heavy
# deps in `mock_deps/`. Kept an extra so the doc-build path never installs them.
# accelerate is required by `device_map="cuda"` in translate/pipeline.py -- without it
# from_pretrained raises before the model is even downloaded.
#
# kernels lets `flash_attention_2` fall back to the kernels-community/flash-attn2 kernel on
# the Hub when the compiled flash-attn package isn't installed. Without it the fallback can't
# happen and from_pretrained raises instead. Compiling flash-attn inside the job would be slow
# and fragile, so the Hub kernel is the path we want.
#
# transformers is floored at 5.8.0, the first release with `WorkloadHints` -- the newest of the
# three continuous-batching pieces `translate/pipeline.py` uses. The other two are older:
# `continuous_batching_context_manager` since 5.0.0 and `ContinuousBatchingConfig` since 5.4.0.
# `WorkloadHints` comes from `transformers.generation.continuous_batching.utils`, which is not
# really a public path, so the floor is the weaker half of the protection -- it stops a
# resolution quietly picking a version where the import is not there yet, and nothing more.
translate = ["torch", "transformers>=5.8.0", "accelerate", "kernels>=0.11.0"]
testing = [
    "pytest",
    "pytest-xdist",
    "torch",
    "transformers",
    "tokenizers",
    "timm",
    "google-api-python-client",
    "httpx"
]
quality = [
    "ruff>=0.1.0"
]
all = [
    # testing dependencies
    "pytest",
    "pytest-xdist",
    "torch",
    "transformers",
    "tokenizers",
    "timm",
    "google-api-python-client",
    "httpx",
    # quality dependencies
    "ruff>=0.1.0"
]
dev = [
    # testing dependencies
    "pytest",
    "pytest-xdist",
    "torch",
    "transformers",
    "tokenizers",
    "timm",
    "google-api-python-client",
    "httpx",
    # quality dependencies
    "ruff>=0.1.0"
]
release = ["twine"]

[project.scripts]
doc-builder = "doc_builder.commands.doc_builder_cli:main"

[project.entry-points.pytest11]
doc-builder = "doc_builder.pytest_plugin"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
doc_builder = ["mock_deps/*.txt", "glossaries/*.yml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
override-dependencies = ["huggingface-hub>=1.5.0"]

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["doc_builder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
