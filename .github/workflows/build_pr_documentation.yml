name: Build PR Documentation

env:
  DIFFUSERS_SLOW_IMPORT: yes

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      package:
        required: true
        type: string
      package_name:
        type: string
        description: "Should be used when a package name differs from its repostory name"
      path_to_docs:
        type: string
      # supply --not_python_module for HF Course
      additional_args:
        type: string
      languages:
      # supply space-separated language codes
        type: string
      package_path:
        type: string
      install_rust:
        type: boolean
      install_libgl1:
        type: boolean
      # Command to execute before building the documentation
      pre_command:
        type: string
      repo_owner:
        type: string
        default: 'huggingface'
        description: "Owner of the repo to build documentation for. Defaults to 'huggingface'."
      version_tag_suffix:
        type: string
        default: "src/"
        description: "Suffix to add after the version tag (e.g. 1.3.0 or main) in the documentation links."
      convert_notebooks:
        type: boolean
        description: "Convert notebooks to markdown files before building docs."
      # Debug purposes only!
      doc_builder_revision:
        type: string
        description: "Debug purposes only. Revision of `doc-builder` repo to use. Useful to test changes on `doc-builder`. Defaults to the revision of this reusable workflow, i.e. the one the caller pinned."
      fail_on_warning:
        type: boolean
        default: false
        description: "Fail doc build when runnable warnings are emitted. Requires `additional_args` to include `--emit-warning`."
      python_version:
        type: string
        description: "Python version for the build venv (e.g. '3.11'). Defaults to the runner's system Python."


permissions: {}

jobs:
  build_pr_documentation:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      UV_HTTP_TIMEOUT: 900 # max 15min to install deps (shouldn't take more than 5min)

    steps:
      # See build_main_documentation.yml: `ref` must be set explicitly, otherwise
      # checkout falls back to the default branch and the caller's pin is a no-op.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.doc_builder_revision || job.workflow_sha }}
          path: doc-builder
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: '${{ inputs.repo_owner }}/${{ inputs.package }}'
          path: ${{ inputs.package }}

      - name: Checkout to the correct commit
        if: ${{ github.event_name == 'issue_comment' }}
        working-directory: ${{ inputs.package }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
        run: |
         git fetch https://github.com/$REPO_OWNER/$PACKAGE.git refs/pull/$PR_NUMBER/merge:refs/remotes/pull/$PR_NUMBER/merge
         git checkout refs/remotes/pull/$PR_NUMBER/merge

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache-dependency-path: "kit/package-lock.json"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Set env variables
        env:
          PATH_TO_DOCS: ${{ inputs.path_to_docs }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_NAME_INPUT: ${{ inputs.package_name }}
        run: |
          if [ -z "$PATH_TO_DOCS" ]
          then
            echo "doc_folder=$PACKAGE/docs/source" >> $GITHUB_ENV
            echo "path_to_docs not provided, defaulting to $PACKAGE/docs/source"
          else
            echo "doc_folder=$PATH_TO_DOCS" >> $GITHUB_ENV
          fi

          if [ -z "$PACKAGE_NAME_INPUT" ];
          then
            package_name="$PACKAGE"
          else
            package_name="$PACKAGE_NAME_INPUT"
          fi

          if [ -z "$PACKAGE_NAME_INPUT" ];
          then
            echo "package_name=$PACKAGE" >> $GITHUB_ENV
          else
            echo "package_name=$PACKAGE_NAME_INPUT" >> $GITHUB_ENV
          fi

      - name: Install libgl1
        if: inputs.install_libgl1
        run: sudo apt-get install -y libgl1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: inputs.install_rust
        with:
          toolchain: stable

      - name: Setup environment
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          PACKAGE_DIR_INPUT: ${{ inputs.package_path || inputs.package }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          uv venv ${PYTHON_VERSION:+--python "$PYTHON_VERSION"}
          source .venv/bin/activate
          cd doc-builder
          uv pip install .
          cd ..

          if [[ "$ADDITIONAL_ARGS" == *"--not_python_module"* ]]
          then
            echo "Not a Python module; skipping package install."
          else
            package_dir="$PACKAGE_DIR_INPUT"
            # Light install when the package has a mock-deps registry entry: only its
            # real (light) doc-build deps are installed and the heavy ones are mocked
            # at build time. Falls back to a full [dev] install otherwise.
            if doc-builder light-install "$PACKAGE_NAME" --check
            then
              uv pip install "./$package_dir" --no-deps
              doc-builder light-install "$PACKAGE_NAME"
            else
              echo "Falling back to a full install."
              uv pip install "./$package_dir[dev]"
            fi
          fi

      - name: Run pre-command
        shell: bash
        env:
          PRE_COMMAND: ${{ inputs.pre_command }}
        run: |
          source .venv/bin/activate
          if [ ! -z "$PRE_COMMAND" ]
          then
            bash -c "$PRE_COMMAND"
          fi

      - name: Convert notebooks to markdown files
        if: inputs.convert_notebooks
        env:
          DOC_FOLDER: ${{ env.doc_folder }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
        run: |
          source .venv/bin/activate
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          remaining_part=$(echo "$DOC_FOLDER" | perl -pe 's|^[^/]+||')
          remaining_part=${remaining_part%/}
          echo "https://colab.research.google.com/github/$REPO_OWNER/$PACKAGE/blob/$branch$remaining_part"

          doc-builder notebook-to-mdx "$DOC_FOLDER" --open_notebook_prefix "https://colab.research.google.com/github/$REPO_OWNER/$PACKAGE/blob/$branch$remaining_part"

      - name: Make documentation
        env:
          NODE_OPTIONS: --max-old-space-size=6656
          DOC_FOLDER: ${{ env.doc_folder }}
          PACKAGE_NAME: ${{ env.package_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
          VERSION_TAG_SUFFIX: ${{ inputs.version_tag_suffix }}
          LANGUAGES: ${{ inputs.languages }}
          FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        shell: bash
        run: |
          source .venv/bin/activate
          echo "doc_folder has been set to $DOC_FOLDER"
          cd doc-builder
          mkdir -p ../build_dir
          log_file="../build_dir/doc-build.log"
          : > "$log_file"
          set -o pipefail
          args="--build_dir ../build_dir --clean --version pr_$PR_NUMBER --html --html_page_cache hf://buckets/hf-doc-build/doc-build-cache $ADDITIONAL_ARGS --repo_owner $REPO_OWNER --repo_name $PACKAGE --version_tag_suffix=$VERSION_TAG_SUFFIX"

          if [ -z "$LANGUAGES" ];
          then
            echo "languages not provided, defaulting to English"
            doc-builder build "$PACKAGE_NAME" "../$DOC_FOLDER" $args 2>&1 | tee -a "$log_file"
          else
            IFS=', ' read -r -a langs <<< "$LANGUAGES"
            for lang in "${langs[@]}"
            do
                echo "Generating docs for language $lang"
                doc-builder build "$PACKAGE_NAME" "../$DOC_FOLDER/$lang" $args --language "$lang" 2>&1 | tee -a "$log_file"
            done
          fi

          warnings_emitted=false
          if [[ "$ADDITIONAL_ARGS" == *"--emit-warning"* ]] && grep -q "Bare assert found in runnable:" "$log_file"; then
            warnings_emitted=true
          fi
          echo "$warnings_emitted" > ../build_dir/warnings_emitted

          if [[ "$warnings_emitted" == "true" && "$FAIL_ON_WARNING" == "true" ]]; then
            echo "::error::Doc build failed because warnings were emitted (fail_on_warning=true)."
            exit 1
          fi
          cd ..

      - name: Save commit_sha & pr_number
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "$COMMIT_SHA" > ./build_dir/commit_sha
          echo "$PR_NUMBER" > ./build_dir/pr_number

      # List the doc pages touched by the PR so the upload workflow can link to them
      # directly in the PR comment. Best-effort: never fails the build.
      - name: Save changed pages
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
          PR_NUMBER: ${{ inputs.pr_number }}
          LANGUAGES: ${{ inputs.languages }}
          DOC_FOLDER: ${{ env.doc_folder }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          : > ./build_dir/changed_pages
          # DOC_FOLDER is relative to the workspace (e.g. `hub-docs/docs/hub/`); make it relative to the repo root
          docs_prefix="${DOC_FOLDER#"$PACKAGE"/}"
          docs_prefix="${docs_prefix%/}/"
          built_root="./build_dir/${PACKAGE_NAME}/pr_${PR_NUMBER}"

          # The checked out commit is the PR merge commit: its first parent is the base branch,
          # so diffing against it gives the PR's changes (no API call / extra permission needed).
          (
            cd "$PACKAGE"
            git fetch --quiet --depth=2 origin "$(git rev-parse HEAD)"
            if [ "$(git rev-list --no-walk --count --merges HEAD)" != "1" ]; then
              echo "HEAD is not a PR merge commit, skipping"
              exit 0
            fi
            git diff --name-only --diff-filter=d HEAD^1 HEAD
          ) > changed_files.txt

          while IFS= read -r file; do
            [[ "$file" == "$docs_prefix"* ]] || continue
            rel="${file#"$docs_prefix"}"
            case "$rel" in
              *.md|*.mdx) ;;
              *) continue ;;
            esac
            page="${rel%.*}"
            # Without `languages`, docs are built under `en/`; with it, the first path component is already the language
            if [ -z "$LANGUAGES" ]; then
              page="en/$page"
            fi
            # Only keep pages that were actually built
            if [ -f "$built_root/$page.html" ]; then
              echo "$page" >> ./build_dir/changed_pages
            fi
          done < changed_files.txt

          echo "Changed pages:"
          cat ./build_dir/changed_pages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doc-build-artifact
          path: build_dir/
