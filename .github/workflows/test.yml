name: Run Tests

on: [pull_request]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: "latest"
    - name: Set up Python 3.11
      # transformers main (installed below) requires Python >= 3.11
      run: uv python install 3.11
    - name: Install dependencies
      run: |
        uv sync --extra all --python 3.11
        uv pip install git+https://github.com/huggingface/transformers
    - name: Run Tests
      # --no-sync keeps transformers main instead of the locked release
      run: uv run --no-sync python -m pytest -n 1 --dist=loadfile -s -v ./tests/
