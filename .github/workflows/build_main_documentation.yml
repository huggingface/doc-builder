name: Build PR Documentation

env:
  DIFFUSERS_SLOW_IMPORT: yes

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      package:
        required: true
        type: string
        description: "Name of the GitHub repo."
      package_name:
        type: string
        description: "Name of the Python package if it differs from repo name."
      path_to_docs:
        type: string
      notebook_folder:
        type: string
      # supply --not_python_module for HF Course
      additional_args:
        type: string
      # Not supported: passing it fails the build. Only English is built; other languages are
      # machine-translated by translate_docs.yml. Kept only to fail with an explicit error.
      languages:
        type: string
      package_path:
        type: string
      install_rust:
        type: boolean
      install_libgl1:
        type: boolean
      # Command to execute before building the documentation
      pre_command:
        type: string
      repo_owner:
        type: string
        default: 'huggingface'
        description: "Owner of the repo to build documentation for. Defaults to 'huggingface'."
      version_tag_suffix:
        type: string
        default: "src/"
        description: "Suffix to add after the version tag (e.g. 1.3.0 or main) in the documentation links."
      convert_notebooks:
        type: boolean
        description: "Convert notebooks to markdown files before building docs."
      python_version:
        type: string
        description: "Python version for the build venv (e.g. '3.11'). Defaults to the runner's system Python."
    secrets:
      hf_token:
        required: true
      token:
        required: false
      translation_dispatch_token:
        # GitHub token allowed to run workflows in huggingface/doc-builder (Actions: write).
        # When set, translated docs are updated right after this build instead of on the daily schedule.
        required: false

permissions: {}

jobs:
  build_main_documentation:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      UV_HTTP_TIMEOUT: 900 # max 15min to install deps (shouldn't take more than 5min)

    steps:
      - name: Reject the languages input
        if: inputs.languages != ''
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          echo "::error::The languages input is no longer supported (got: $LANGUAGES). Only English is built; other languages are machine-translated by doc-builder's translate_docs.yml. Remove it and point path_to_docs at the English docs (e.g. docs/source/en)."
          exit 1

      # Check out this reusable workflow's own revision, so that the doc-builder
      # code installed below is exactly the revision the caller pinned in `uses:`.
      # Without an explicit `ref`, actions/checkout falls back to the default
      # branch of the target repository: the caller's pin would then only apply to
      # this YAML file, never to the code that runs with the build secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: doc-builder
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: '${{ inputs.repo_owner }}/${{ inputs.package }}'
          path: ${{ inputs.package }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: inputs.notebook_folder != ''
        with:
          repository: 'huggingface/notebooks'
          path: notebooks
          token: ${{ secrets.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache-dependency-path: "kit/package-lock.json"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set env variables
        env:
          PATH_TO_DOCS: ${{ inputs.path_to_docs }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_NAME_INPUT: ${{ inputs.package_name }}
        run: |
          if [ -z "$PATH_TO_DOCS" ]
          then
            echo "doc_folder=$PACKAGE/docs/source" >> $GITHUB_ENV
            echo "path_to_docs not provided, defaulting to $PACKAGE/docs/source"
          else
            echo "doc_folder=$PATH_TO_DOCS" >> $GITHUB_ENV
          fi

          if [ -z "$PACKAGE_NAME_INPUT" ];
          then
            echo "package_name=$PACKAGE" >> $GITHUB_ENV
          else
            echo "package_name=$PACKAGE_NAME_INPUT" >> $GITHUB_ENV
          fi

      # Needed to upload zips to hf.co
      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Install libgl1
        if: inputs.install_libgl1
        run: sudo apt-get install -y libgl1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: inputs.install_rust
        with:
          toolchain: stable

      - name: Setup environment
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          PACKAGE_DIR_INPUT: ${{ inputs.package_path || inputs.package }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          if [ -n "$PYTHON_VERSION" ]
          then
            uv venv --python "$PYTHON_VERSION"
          else
            uv venv
          fi
          source .venv/bin/activate
          cd doc-builder
          uv pip install .
          cd ..

          if [[ "$ADDITIONAL_ARGS" == *"--not_python_module"* ]]
          then
            echo "Not a Python module; skipping package install."
          else
            package_dir="$PACKAGE_DIR_INPUT"
            # Light install when the package has a mock-deps registry entry: only its
            # real (light) doc-build deps are installed and the heavy ones are mocked
            # at build time. Falls back to a full [dev] install otherwise.
            if doc-builder light-install "$PACKAGE_NAME" --check
            then
              uv pip install "./$package_dir" --no-deps
              doc-builder light-install "$PACKAGE_NAME"
            else
              echo "Falling back to a full install."
              uv pip install "./$package_dir[dev]"
            fi
          fi

      - name: Setup git
        run: |
          git config --global user.name "Hugging Face Doc Builder"
          git config --global user.email docs@huggingface.co

      # The version list is read from the bucket we serve from, not from the legacy
      # dataset: a version advertised in _versions.yml with no matching folder in the
      # bucket makes hf.co/docs/<package> 404 on its default version.
      - name: Create build directory
        env:
          HF_TOKEN: ${{ secrets.hf_token }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          mkdir build_dir
          mkdir build_dir/$PACKAGE_NAME
          cd build_dir/$PACKAGE_NAME
          uvx --from huggingface_hub hf cp "hf://buckets/hf-doc-build/doc/$PACKAGE_NAME/_versions.yml" _versions.yml

      - name: Run pre-command
        shell: bash
        env:
          PRE_COMMAND: ${{ inputs.pre_command }}
        run: |
          source .venv/bin/activate
          if [ ! -z "$PRE_COMMAND" ]
          then
            bash -c "$PRE_COMMAND"
          fi

      - name: Convert notebooks to markdown files
        if: inputs.convert_notebooks
        env:
          DOC_FOLDER: ${{ env.doc_folder }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
        run: |
          source .venv/bin/activate
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          remaining_part=$(echo "$DOC_FOLDER" | perl -pe 's|^[^/]+||')
          remaining_part=${remaining_part%/}
          echo "https://colab.research.google.com/github/$REPO_OWNER/$PACKAGE/blob/$branch$remaining_part"

          doc-builder notebook-to-mdx "$DOC_FOLDER" --open_notebook_prefix "https://colab.research.google.com/github/$REPO_OWNER/$PACKAGE/blob/$branch$remaining_part"

      - name: Make documentation
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6656
          # needed for --html_page_cache_write (trusted main builds only)
          HF_TOKEN: ${{ secrets.hf_token }}
          DOC_FOLDER: ${{ env.doc_folder }}
          PACKAGE_NAME: ${{ env.package_name }}
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
          VERSION_TAG_SUFFIX: ${{ inputs.version_tag_suffix }}
          NOTEBOOK_FOLDER: ${{ inputs.notebook_folder }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          source .venv/bin/activate
          echo "doc_folder has been set to $DOC_FOLDER"
          cd doc-builder
          args="--build_dir ../build_dir --clean --html --html_page_cache hf://buckets/hf-doc-build/doc-build-cache --html_page_cache_write $ADDITIONAL_ARGS --repo_owner $REPO_OWNER --repo_name $PACKAGE --version_tag_suffix=$VERSION_TAG_SUFFIX"

          if [ ! -z "$NOTEBOOK_FOLDER" ];
          then
            args="$args --notebook_dir ../notebook_dir"
          fi

          doc-builder build "$PACKAGE_NAME" "../$DOC_FOLDER" $args

          # The version comes from the package, so a default branch that declares a release
          # (e.g. bumped at release time) only built that release: build main from it too.
          if [ "$ON_DEFAULT_BRANCH" = true ] && [[ ! "$ADDITIONAL_ARGS" =~ --version[=\ ] ]] \
            && ! ls "../build_dir/$PACKAGE_NAME" | grep -qvE '^(v[0-9].*|_versions\.yml)$'; then
            doc-builder build "$PACKAGE_NAME" "../$DOC_FOLDER" $args --version main
          fi

          cd ..

      - name: Sync to bucket
        env:
          HF_TOKEN: ${{ secrets.hf_token }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          cd build_dir
          uvx --from huggingface_hub hf sync "./$PACKAGE_NAME" "hf://buckets/hf-doc-build/doc/$PACKAGE_NAME"
          cd ..

      # Translations follow the English build without waiting for the daily run; never fails the build.
      - name: Trigger translation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.translation_dispatch_token }}
          PACKAGE_NAME: ${{ env.package_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No translation_dispatch_token; translations update on the daily schedule."
            exit 0
          fi
          if ! python3 - "$PACKAGE_NAME" <<'EOF'
          import ast, sys
          source = open("doc-builder/src/doc_builder/translate_docs.py").read()
          node = next(n for n in ast.parse(source).body if isinstance(n, ast.Assign) and n.targets[0].id == "TRANSLATED_DOCS")
          sys.exit(0 if sys.argv[1] in ast.literal_eval(node.value) else 1)
          EOF
          then
            echo "$PACKAGE_NAME is not translated."
            exit 0
          fi
          gh workflow run translate_docs.yml --repo huggingface/doc-builder -f libraries="$PACKAGE_NAME"

      - name: Push to dataset (legacy, kept for rollback safety)
        env:
          PACKAGE_NAME: ${{ env.package_name }}
          HF_TOKEN: ${{ secrets.hf_token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REPO_OWNER: ${{ inputs.repo_owner }}
          PACKAGE: ${{ inputs.package }}
        run: |
          source .venv/bin/activate
          cd build_dir
          doc-builder push "$PACKAGE_NAME" --doc_build_repo_id "hf-doc-build/doc-build" --token "$HF_TOKEN" --commit_msg "Updated with commit $COMMIT_SHA See: https://github.com/$REPO_OWNER/$PACKAGE/commit/$COMMIT_SHA" --n_retries 5 --upload_version_yml
          cd ..

      - name: Commit notebooks
        env:
          NOTEBOOK_FOLDER: ${{ inputs.notebook_folder }}
          PACKAGE: ${{ inputs.package }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -d "notebook_dir" ]
          then
            cd notebooks
            git pull
            cp -r ../notebook_dir/. "$NOTEBOOK_FOLDER"
            git status
            if [[ `git status --porcelain` ]]; then
              git add "$NOTEBOOK_FOLDER"
              git commit -m "Updated $PACKAGE doc notebooks with commit $COMMIT_SHA \n\nSee: https://github.com/huggingface/$PACKAGE/commit/$COMMIT_SHA"
              git push origin main ||
              (echo "Failed on the first try, rebasing and pushing again" && git pull --rebase && git push origin main) ||
              (echo "Failed on the second try, rebasing and pushing again" && git pull --rebase && git push origin main)
            else
              echo "No diff in the notebooks."
            fi
            cd ..
          else
            echo "Notebooks creation was not enabled."
          fi
        shell: bash
