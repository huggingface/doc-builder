name: Populate Search Engine

on:
  schedule:
    - cron: "5 7 * * 1-6" # Monday to Saturday at 07:05, with the blog posts of the last two days
    - cron: "5 7 * * 0" # Sunday at 07:05, with every blog post, which also deletes removed and renamed posts
  # to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      all_blog_posts:
        description: "Fetch every blog post, which also deletes removed and renamed posts (unchecked: the last two days)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  process-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Set timeout to 6 hours
    steps:
      - name: Checkout doc-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "latest"

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install doc-builder
        run: uv sync --extra dev

      - name: Populate search engine from HF doc-build dataset
        env:
          HF_IE_URL: ${{ secrets.HF_IE_URL }}
          HF_IE_TOKEN: ${{ secrets.HF_IE_TOKEN }}
          MEILISEARCH_KEY: ${{ secrets.MEILISEARCH_KEY }}
          MEILISEARCH_URL: ${{ secrets.MEILISEARCH_URL }}
          HF_TOKEN: ${{ secrets.HF_EMBED_DATASETS_TOKEN }}
          ALL_BLOG_POSTS: ${{ github.event.schedule == '5 7 * * 0' || inputs.all_blog_posts }}
        run: |
          if [ "$ALL_BLOG_POSTS" = true ]; then
            uv run doc-builder populate-search-engine --incremental
          else
            # Two days, so that a run delayed or failed the day before misses no post
            uv run doc-builder populate-search-engine --incremental --recent-blog-days 2
          fi
