
name: Accelerate doc build

on: [pull_request]

jobs:
  integration_doc_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'huggingface/doc-builder'
          path: doc-builder
      
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'huggingface/accelerate'
          path: accelerate
          ref: 16eb6d76bf987c7d8d877ce5152f2e29878eab37

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 'latest'

      - name: Ensure Python 3.10
        run: uv python install 3.10

      - name: Create virtual environment
        run: uv venv --python 3.10 .venv

      - name: Install Python dependencies
        # light install: only accelerate's real (light) doc-build deps; torch & co are
        # mocked at build time from the mock-deps registry
        run: |
          uv pip install --python .venv/bin/python ./doc-builder
          uv pip install --python .venv/bin/python --no-deps ./accelerate
          ./.venv/bin/doc-builder light-install accelerate

      - name: Make documentation
        run: |
          cd doc-builder &&
          ../.venv/bin/doc-builder build accelerate ../accelerate/docs/source --build_dir ../build_dir --clean --html &&
          cd ..
        env:
          NODE_OPTIONS: --max-old-space-size=6656