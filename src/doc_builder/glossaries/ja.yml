# Japanese terminology. Exact English word matches ignore case.
# keep terms are protected before generation; pin renderings guide terminology in context.
# Changing this file invalidates the complete-page cache for this language.

pin:
  Hub: Hub
  API: API
  big model inference: 大規模モデル推論
  # These had a competing translation. The number is how many pages used this one.
  fine-tune: 微調整                   # 54 files, vs ファインチューニング 15
  fine-tuning: 微調整                 # "fine-tune" does not match this one
  pretrained: 事前トレーニング済み    # 30 files, vs 事前学習済みモデル 12
